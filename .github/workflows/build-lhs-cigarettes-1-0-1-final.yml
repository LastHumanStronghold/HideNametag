name: Build LHS Cigarettes 1.0.1

on:
  push:
    branches:
      - build-lhs-cigarettes-1-0-1-final

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract source and update version
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          unzip -q lhs-cigarettes.zip -d work
          cd work/lhs-cigarettes
          python - <<'PY'
          from pathlib import Path

          source = Path("src/main/java/com/mainlhs/cigs/client/SmokeLayer.java")
          text = source.read_text(encoding="utf-8")
          old = "import net.minecraft.client.renderer.entity.RenderLayer;"
          new = "import net.minecraft.client.renderer.entity.layers.RenderLayer;"
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("RenderLayer import not found; refusing an unsafe replacement")
          if "import net.minecraft.client.renderer.entity.RenderLayerParent;" not in text:
              raise SystemExit("RenderLayerParent must remain in net.minecraft.client.renderer.entity")
          source.write_text(text, encoding="utf-8")

          gradle = Path("build.gradle")
          build = gradle.read_text(encoding="utf-8")
          if build.count("version = '1.0.0'") != 1:
              raise SystemExit("Expected exactly one version = '1.0.0' in build.gradle")
          build = build.replace("version = '1.0.0'", "version = '1.0.1'", 1)
          if "Implementation-Version" not in build:
              build += """

          tasks.named('jar', Jar).configure {
              manifest.attributes('Implementation-Version': project.version.toString())
          }
          """
          gradle.write_text(build, encoding="utf-8")

          readme = Path("README.md")
          if readme.exists():
              data = readme.read_text(encoding="utf-8")
              data = data.replace("LHS-Cigarettes-1.0.0.jar", "LHS-Cigarettes-1.0.1.jar")
              readme.write_text(data, encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          old_log = changelog.read_text(encoding="utf-8") if changelog.exists() else "# Changelog\n"
          if "## 1.0.1" not in old_log:
              old_log = old_log.replace("# Changelog", "# Changelog\n\n## 1.0.1\n- Updated mod version and fixed the Forge 1.20.1 RenderLayer import.\n", 1)
          changelog.write_text(old_log, encoding="utf-8")
          PY
          chmod +x gradlew
          ./gradlew --no-daemon clean build

      - name: Verify JAR and prepare updated source
        shell: bash
        run: |
          set -euo pipefail
          JAR="work/lhs-cigarettes/build/libs/LHS-Cigarettes-1.0.1.jar"
          test -s "$JAR"
          jar tf "$JAR" | grep -q 'META-INF/mods.toml'
          python - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          jar = Path("work/lhs-cigarettes/build/libs/LHS-Cigarettes-1.0.1.jar")
          with ZipFile(jar) as z:
              metadata = z.read("META-INF/mods.toml").decode("utf-8")
              manifest = z.read("META-INF/MANIFEST.MF").decode("utf-8")
          if 'version="1.0.1"' not in metadata:
              raise SystemExit("Expected mod version 1.0.1 in META-INF/mods.toml; got:\n" + metadata)
          if "Implementation-Version: 1.0.1" not in manifest:
              raise SystemExit("Implementation-Version 1.0.1 missing from JAR manifest")
          print("Verified mods.toml and manifest version 1.0.1")
          PY
          (cd work && zip -qr ../lhs-cigarettes-1.0.1-source.zip lhs-cigarettes)
          sha256sum "$JAR"

      - name: Upload compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: LHS-Cigarettes-1.0.1-JAR
          path: work/lhs-cigarettes/build/libs/LHS-Cigarettes-1.0.1.jar
          if-no-files-found: error
          retention-days: 7

      - name: Upload updated source archive
        uses: actions/upload-artifact@v4
        with:
          name: LHS-Cigarettes-1.0.1-Source
          path: lhs-cigarettes-1.0.1-source.zip
          if-no-files-found: error
          retention-days: 7
