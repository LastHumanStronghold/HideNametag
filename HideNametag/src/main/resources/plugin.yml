name: HideNametag
version: 1.0.0
main: ru.hidenametag.HideNametagPlugin
api-version: '1.21'
author: Claude
description: Скрывает никнейм игрока над головой (аналог nametag-visibility из TAB)

commands:
  hidenametag:
    description: Включить/выключить скрытие ников над головой
    usage: /hidenametag <on|off|status>
    permission: hidenametag.admin
    permission-message: У вас нет прав на использование этой команды.

permissions:
  hidenametag.admin:
    description: Доступ к команде управления плагином
    default: op
