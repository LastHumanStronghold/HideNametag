name: HideNametag
version: 1.1.0
main: ru.hidenametag.HideNametagPlugin
api-version: '1.21'
author: LastHumanStronghold
description: Скрывает никнеймы игроков над головой

commands:
  hidenametag:
    description: Включить, выключить или проверить скрытие никнеймов
    usage: /hidenametag <on|off|status>
    permission: hidenametag.admin
    permission-message: §cУ вас нет прав на использование этой команды.

permissions:
  hidenametag.admin:
    description: Доступ к управлению скрытием никнеймов
    default: op
